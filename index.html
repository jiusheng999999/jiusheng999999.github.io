<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>前端表格示例</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 60%;
      margin: 30px auto;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
    }

    th {
      background-color: #f4f4f4;
    }

    tr:hover {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <h1>学生信息表</h1>

  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>专业</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1001</td>
        <td>张三</td>
        <td>20</td>
        <td>计算机科学</td>
      </tr>
      <tr>
        <td>1002</td>
        <td>李四</td>
        <td>21</td>
        <td>软件工程</td>
      </tr>
      <tr>
        <td>1003</td>
        <td>王五</td>
        <td>22</td>
        <td>人工智能</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
